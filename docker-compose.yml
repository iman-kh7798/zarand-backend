# docker-compose.yml — local / single-host orchestration for zarand-backend
#
#   docker compose up -d --build        # start db + backend (runs migrations)
#   docker compose --profile cache up -d # also start redis
#
# Config is read from a .env file next to this file (copy .env.docker.example).

services:
  # ---------------------------------------------------------------------------
  # MariaDB — matches the runtime driver adapter (@prisma/adapter-mariadb)
  # ---------------------------------------------------------------------------
  db:
    image: mariadb:11.4
    container_name: zarand-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME:-zarand}
      MARIADB_USER: ${DATABASE_USER:-zarand}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:-zarand_pass}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-root_pass}
    ports:
      # host:container — host side is 3307 so it won't clash with a local MySQL
      - "${DATABASE_HOST_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # ships with the mariadb image; succeeds only once InnoDB is ready
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # NestJS API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      target: production
    container_name: zarand-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000

      # --- runtime DB access (PrismaService driver adapter) ---
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: ${DATABASE_USER:-zarand}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-zarand_pass}
      DATABASE_NAME: ${DATABASE_NAME:-zarand}

      # --- Prisma CLI (migrate deploy / seed) needs a URL form ---
      #     host = the `db` service, NOT localhost. Keep creds in sync with above.
      DATABASE_URL: "mysql://${DATABASE_USER:-zarand}:${DATABASE_PASSWORD:-zarand_pass}@db:3306/${DATABASE_NAME:-zarand}"

      # --- auth ---
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600s}

      # --- SMS (Kavenegar, external API) ---
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-10008663}

      # --- run `prisma db seed` once on container start (roles + admin) ---
      RUN_SEED: ${RUN_SEED:-false}

      # --- optional cache (only when the `cache` profile is up) ---
      REDIS_URL: redis://redis:6379
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      # persist user uploads + rotating winston logs
      # (docker-compose.override.yml re-points these at ./uploads and ./logs for dev)
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Redis — OPTIONAL. `ioredis` is installed but not wired up yet.
  # Start with:  docker compose --profile cache up -d
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: zarand-redis
    restart: unless-stopped
    profiles: ["cache"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db_data:
  redis_data:
  uploads_data:
  logs_data:

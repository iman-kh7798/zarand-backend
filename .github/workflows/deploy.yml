name: Build and deploy to VPS

on:
  push:
    branches: [dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # ghcr.io/iman-kh7798/zarand-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          # trim accidental trailing whitespace/newlines/CR from secrets before using them
          host="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          port="$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')"
          echo "SSH_HOST_CLEAN=$host" >> "$GITHUB_ENV"
          echo "SSH_PORT_CLEAN=$port" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$port" "$host" >> ~/.ssh/known_hosts

      - name: Copy compose file to VPS
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_PATH: ${{ secrets.APP_PATH }}
        run: |
          user="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          app_path="$(printf '%s' "$APP_PATH" | tr -d '[:space:]')"
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT_CLEAN}" \
            ./docker-compose.prod.yml \
            "${user}@${SSH_HOST_CLEAN}:${app_path}/docker-compose.prod.yml"

      - name: Pull new image and restart
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_PATH: ${{ secrets.APP_PATH }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          user="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          app_path="$(printf '%s' "$APP_PATH" | tr -d '[:space:]')"
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT_CLEAN}" "${user}@${SSH_HOST_CLEAN}" \
            "cd '${app_path}' && \
             sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/' .env && \
             docker compose -f docker-compose.prod.yml pull && \
             docker compose -f docker-compose.prod.yml up -d && \
             docker image prune -f"

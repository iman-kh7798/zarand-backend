name: Deploy NestJS to cPanel

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      # 🟢 گام کلیدی: تولید کلاینت پریزما قبل از بیلد و اجرای Seed
      - name: Generate Prisma Client
        run: npx prisma generate
        # اگر فایل schema.prisma شما در پوشه خاصی است مسیرش رو بده، مثلاً:
        # run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Run Build
        run: npm run build --if-present

      - name: Deploy files via SCP/rsync
        uses: AppleBoy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_SECRET_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # حواست باشه پوشه prisma رو هم بفرستی چون برای مایگریشن‌های سرور لازم میشه
          source: 'dist/,package.json,package-lock.json,prisma/'
          target: '/home/${{ secrets.SSH_USER }}/api.maedemohkami.ir'
          strip_components: 0

      - name: Executing remote SSH commands to restart app
        uses: AppleBoy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/api.maedemohkami.ir

            # (اختیاری) اگر نیاز داری روی سرور اصلی هم پریزما جنریت یا مایگریت بشه:
            # /path-to-node-binary/npx prisma migrate deploy

            mkdir -p tmp
            touch tmp/restart.txt
